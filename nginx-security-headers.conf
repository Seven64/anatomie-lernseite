# Security-Header für Anatomie Lernseite.
# Wird in nginx.conf per include in server- UND location-Blöcken eingebunden,
# weil ein add_header in einem location-Block alle geerbten Header aufhebt.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# Alles wird lokal ausgeliefert (inkl. Draco-Decoder). 'wasm-unsafe-eval' wird für
# den Draco-WebAssembly-Decoder im Blob-Worker von Three.js benötigt.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
