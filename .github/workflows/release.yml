name: Release

# Erkennt die Version automatisch aus package.json auf main.
# Gibt es für diese Version noch kein Release, werden Windows-Installer und Web-ZIP
# gebaut und Tag „vX.Y.Z“ samt GitHub-Release angelegt. Existiert es bereits, passiert nichts.
# Neues Release = Version in package.json anheben und nach main mergen.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probelauf: alles bauen und prüfen, aber nichts veröffentlichen"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Version erkennen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read version and check for existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag existiert bereits – nichts zu tun."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Neue Version erkannt: $tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Testen
    runs-on: ubuntu-latest
    needs: detect
    # Im Probelauf auch dann bauen, wenn das Release bereits existiert.
    if: needs.detect.outputs.release == 'true' || inputs.dry_run
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Typecheck, tests and data check
        run: npm run check
      - name: Release notes must mention the version
        run: grep -q "${{ needs.detect.outputs.version }}" RELEASE_NOTES.md || { echo "::error::RELEASE_NOTES.md erwähnt Version ${{ needs.detect.outputs.version }} nicht"; exit 1; }

  web:
    name: Web-Paket
    runs-on: ubuntu-latest
    needs: [detect, verify]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build web app
        run: npm run build
      - name: Create ZIP
        run: |
          mkdir -p release
          (cd dist && zip -qr "../release/Anatomie-Lernseite-Web-${{ needs.detect.outputs.version }}.zip" .)
      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: web-package
          path: release/*.zip
          if-no-files-found: error

  windows:
    name: Windows-Installer
    runs-on: windows-latest
    needs: [detect, verify]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build NSIS installer
        run: npm run desktop:win -- --publish never
        env:
          # Kein Code-Signing: Zertifikate gehören nicht ins Repository.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error

  release:
    name: GitHub-Release veröffentlichen
    runs-on: ubuntu-latest
    needs: [detect, web, windows]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: (cd artifacts && sha256sum *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Check release assets
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          ls -la artifacts
          test -f "artifacts/Anatomie-Lernseite-Setup-$VERSION.exe"
          test -f "artifacts/Anatomie-Lernseite-Web-$VERSION.zip"
          {
            echo "### Release ${{ needs.detect.outputs.tag }}${{ inputs.dry_run && ' (Probelauf – nicht veröffentlicht)' || '' }}"
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release (legt Tag auf diesem Commit an)
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anatomie Lernseite ${{ needs.detect.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            artifacts/*.exe
            artifacts/*.exe.blockmap
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
