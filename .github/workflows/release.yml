name: Release

# Erstellt ein GitHub-Release mit Windows-Installer und Web-Paket.
# Auslöser: Tag „vX.Y.Z“ pushen (muss zur Version in package.json passen).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestehendes Tag, z. B. v1.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Version prüfen & testen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Compare tag and package.json version
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG passt nicht zur package.json-Version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Typecheck, tests and data check
        run: npm run check

  web:
    name: Web-Paket
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build web app
        run: npm run build
      - name: Create ZIP
        run: |
          mkdir -p release
          (cd dist && zip -qr "../release/Anatomie-Lernseite-Web-${{ needs.verify.outputs.version }}.zip" .)
      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: web-package
          path: release/*.zip
          if-no-files-found: error

  windows:
    name: Windows-Installer
    runs-on: windows-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build NSIS installer
        run: npm run desktop:win -- --publish never
        env:
          # Kein Code-Signing: Zertifikate gehören nicht ins Repository.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error

  release:
    name: GitHub-Release veröffentlichen
    runs-on: ubuntu-latest
    needs: [verify, web, windows]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: (cd artifacts && sha256sum *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Anatomie Lernseite ${{ needs.verify.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.exe
            artifacts/*.exe.blockmap
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
